# Local development: runs Dex OIDC identity provider
# Platform runs outside Docker via: npm run dev

services:
  dex:
    image: ghcr.io/enopax/dex:2.45.1_file_store
    command: ["dex", "serve", "/etc/dex/dex.yaml"]
    ports:
      - "5556:5556"   # OIDC (HTTP)
      - "5557:5557"   # gRPC (user management)
    volumes:
      - ./dex-dev.yaml:/etc/dex/dex.yaml:ro
      - dex-data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5556/dex/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  dex-data:
